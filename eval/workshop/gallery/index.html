<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blind pilot gallery</title>
  <link rel="stylesheet" href="/gallery.css">
  <script src="/gallery.js" defer></script>
</head>
<body>
  <header>
    <p class="eyebrow">Blind pilot · Evaluation workspace</p>
    <h1>Compare the previews</h1>
    <p>Give separate votes for visual quality and task completion. Assignments stay hidden until every ballot is saved.</p>
  </header>
  <main>
    <section class="toolbar" aria-label="Comparison controls">
      <label>Comparison <select id="comparison" disabled></select></label>
      <label>Preview <select id="preview">
        <option value="desktop">Screenshot · 1440 × 960</option>
        <option value="mobile">Screenshot · 390 × 844</option>
        <option value="live-desktop">Interactive · 1440 × 960</option>
        <option value="live-mobile">Interactive · 390 × 844</option>
      </select></label>
      <button id="export" type="button" disabled>Export votes</button>
      <button id="reveal" type="button" disabled>Reveal assignments</button>
      <p id="status" role="status"></p>
    </section>
    <h2 id="brief" hidden></h2>
    <section id="sides" aria-label="A and B previews" hidden></section>
    <form id="ballot" hidden>
      <h2>Ballot</h2>
      <div id="choices"></div>
      <label for="reason">Reason</label>
      <textarea id="reason" name="reason" rows="3" maxlength="1000" required></textarea>
      <button type="submit">Save ballot</button>
    </form>
  </main>
</body>
</html>
