name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-main
  queue: max

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reserve release version for this push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -B .github/scripts/prepare-release.py
      - name: Pack tagged version
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$VERSION" = "$version"
          test "$(cargo metadata --no-deps --locked --format-version=1 --manifest-path engine/Cargo.toml | jq -r '.packages[0].version')" = "$version"
          npm pack --json > "$RUNNER_TEMP/pack.json"
          echo "ARCHIVE=$(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json")" >> "$GITHUB_ENV"
      - name: Publish the archive with npm trusted publishing
        run: |
          registry=https://registry.npmjs.org
          url="$registry/ultimate-frontend/$VERSION"
          status=$(curl -sS -o "$RUNNER_TEMP/version.json" -w '%{http_code}' "$url")
          case "$status" in
            404) npm publish "$ARCHIVE" --registry="$registry" --access public --provenance ;;
            200) test "$(jq -r '.dist.integrity' "$RUNNER_TEMP/version.json")" = "$(jq -r '.[0].integrity' "$RUNNER_TEMP/pack.json")" ;;
            *) echo "Registry returned HTTP $status" >&2; exit 1 ;;
          esac
      - name: Create GitHub Release with the published archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --generate-notes --title "$tag"
          fi
          info=$(gh release view "$tag" --json isDraft,assets)
          if ! jq -e --arg name "$ARCHIVE" 'any(.assets[]; .name == $name)' <<< "$info" >/dev/null; then
            gh release upload "$tag" "$ARCHIVE"
          fi
          gh release download "$tag" --pattern "$ARCHIVE" --output "$RUNNER_TEMP/published.tgz"
          cmp "$ARCHIVE" "$RUNNER_TEMP/published.tgz"
          if [[ $(jq -r .isDraft <<< "$info") == true ]]; then
            gh release edit "$tag" --draft=false
          fi
