<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1e8"><title>Синий оттиск — мастерская печатной графики</title><style>
:root{--paper:#f5f2e9;--blue:#2035a4;--line:#2035a44f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--blue);font-family:Arial,Helvetica,sans-serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.19;background:url('paper.svg')}button,a{color:inherit}button{font:inherit;cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible{outline:2px dashed currentColor;outline-offset:4px}.shell{width:min(1440px,calc(100% - 112px));margin:auto}.top{height:77px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;justify-self:start;font-size:12px;font-weight:900;letter-spacing:.065em;line-height:1.03}.brand svg{width:33px;height:33px}.nav{display:flex;align-items:center;gap:37px;font-size:14px}.nav a{padding:9px 0;position:relative}.nav a[aria-current]:after{content:'';position:absolute;left:0;right:0;bottom:3px;height:1px;background:currentColor}.index{justify-self:end;border:1px solid var(--line);background:none;padding:9px 13px;display:flex;align-items:center;gap:14px;font-size:13px}.index:hover,.arrows button:hover,.detail:hover{background:var(--blue);color:var(--paper)}.mast{display:grid;grid-template-columns:1fr 200px;align-items:end;padding:28px 0 27px;gap:20px}.mast h1{font-size:clamp(60px,8.65vw,128px);font-weight:900;letter-spacing:-.081em;line-height:.84;margin:0 0 0 -.065em}.mast h1 span{display:block}.side{align-self:end;border-top:1px solid var(--line);padding-top:12px;margin-bottom:2px;display:flex;align-items:flex-start;justify-content:space-between;font-size:15px;line-height:1.25}.side svg{width:28px;height:28px;margin-top:2px}.print{margin:0}.frame{position:relative;background:#2436a7;overflow:hidden;aspect-ratio: 3.05}.frame canvas{width:100%;height:100%;display:block;object-fit:cover;transition:transform .45s ease;transform-origin:64% 58%}.frame.zoom canvas{transform:scale(2.25)}.detail{position:absolute;bottom:15px;right:15px;border:0;background:var(--paper);padding:9px 11px;display:flex;gap:9px;align-items:center;font-size:12px}.detail svg{width:15px;height:15px}.strip{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;min-height:83px;border-bottom:1px solid var(--line)}.metadata{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 22px}.metadata strong{font-size:23px;letter-spacing:-.045em}.metadata span{font-size:13px}.controls{display:flex;align-items:center;gap:23px}.count{font:13px/1 monospace;white-space:nowrap}.count i{font-style:normal;opacity:.65;padding:0 4px}.arrows{display:flex}.arrows button{background:none;border:1px solid var(--line);width:42px;height:37px;display:grid;place-items:center}.arrows button+button{border-left:0}.arrows svg,.index svg{width:16px;height:16px}.foot{display:flex;justify-content:space-between;padding:15px 0 22px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}.foot a:hover{text-decoration:underline}dialog{width:min(550px,calc(100% - 30px));padding:25px 30px 30px;background:var(--paper);color:var(--blue);border:1px solid var(--blue)}dialog::backdrop{background:#111c61a3}.dialog-top{display:flex;justify-content:space-between;align-items:start;gap:10px}.dialog-top h2{margin:0 0 23px;font-size:clamp(31px,7vw,53px);line-height:.95;letter-spacing:-.075em}.close{background:none;border:1px solid var(--line);width:35px;height:35px;font-size:24px;line-height:1}.list button{display:grid;grid-template-columns:1fr auto;text-align:left;gap:8px;background:none;border:0;border-top:1px solid var(--line);width:100%;padding:13px 0}.list button:last-child{border-bottom:1px solid var(--line)}.list button:hover strong,.list button[aria-current] strong{text-decoration:underline}.list small{grid-column:1;line-height:1.4}.list b{grid-column:2;grid-row:1/3;align-self:center}.about{line-height:1.55;max-width:45ch}.about p{margin:0 0 14px}.about p:last-child{margin-bottom:0}@media(max-width:900px){.shell{width:calc(100% - 64px)}.mast{grid-template-columns:1fr 155px}.frame{aspect-ratio:2.55}}@media(max-width:600px){.shell{width:calc(100% - 32px)}.top{height:auto;grid-template-columns:1fr 1fr;padding-top:13px}.nav{grid-row:2;grid-column:1/-1;justify-content:space-between;gap:12px;margin-top:9px;font-size:13px}.mast{display:block;padding:23px 0 15px}.mast h1{font-size:clamp(42px,11.9vw,72px)}.side{margin-top:13px;padding-top:8px;font-size:12px;align-items:center}.side br{display:none}.side svg{width:19px;height:19px;margin:0}.frame{aspect-ratio:1.16}.frame canvas{object-position:60% center;transform-origin:64% 55%}.detail{bottom:8px;right:8px}.strip{min-height:73px}.metadata{display:grid;gap:3px}.metadata strong{font-size:18px}.metadata span{font-size:11px}.controls{gap:7px}.count{font-size:11px}.count i{padding:0 1px}.arrows button{width:32px;height:34px}.foot{font-size:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><header class="top"><a href="#работы" class="brand" aria-label="Синий оттиск — работы"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M2 2h32v32H2z" fill="currentColor"/><path d="M6 26L26 6M6 32L32 6M12 32L32 12M6 20L20 6M18 32L32 18" stroke="#f5f2e9" stroke-width="1.35"/></svg><span>СИНИЙ<br>ОТТИСК</span></a><nav class="nav" aria-label="Разделы"><a href="#работы" aria-current="page">Работы</a><a href="#техники" data-panel="tech">Техники</a><a href="#мастерская" data-panel="about">О мастерской</a></nav><button class="index" data-panel="index">Индекс <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 15L15 4M6 4h9v9"/></svg></button></header><main id="работы"><div class="mast"><h1><span>ПЕЧАТНАЯ</span> <span>ГРАФИКА</span></h1><div class="side"><span>Мастерская<br> ручной печати</span><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="16" cy="16" r="9"/><path d="M16 0v32M0 16h32"/></svg></div></div><figure class="print"><div class="frame"><canvas width="1500" height="590" role="img"></canvas><button class="detail" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><path d="M8 3H3v5m9-5h5v5M3 12v5h5m9-5v5h-5M7 10h6m-3-3v6"/></svg><span>Фактура</span></button></div><figcaption class="strip"><div class="metadata" aria-live="polite"><strong id="workTitle">Северный ветер</strong><span id="workMeta">Линогравюра · 24 × 60 см</span></div><div class="controls"><span class="count"><span id="num">01</span><i> / </i>03</span><div class="arrows"><button id="prev" aria-label="Предыдущий оттиск"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><path d="M16 10H4m5-5-5 5 5 5"/></svg></button><button id="next" aria-label="Следующий оттиск"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg></button></div></div></figcaption></figure></main><footer class="foot"><span>Синий оттиск</span><a href="#работы" data-panel="tech">О техниках печати ↗</a></footer></div><dialog aria-labelledby="panelTitle"><div class="dialog-top"><h2 id="panelTitle"></h2><button class="close" aria-label="Закрыть">×</button></div><div id="panelBody"></div></dialog><script src="prints.js"></script><script>
const works=[['Северный ветер','Линогравюра','24 × 60 см','Синие волны с резными белыми гребнями под круглой луной','Рисунок вырезают на линолеуме. Краска остаётся на выступающих участках и переносится на бумагу.'],['Сухие травы','Шелкография','24 × 60 см','Охристые силуэты трав на красном фоне','Краску продавливают через сетку с трафаретом. Для каждого цвета нужна отдельная форма.'],['Камни у воды','Монотипия','24 × 60 см','Зелёные и чёрные силуэты камней у воды','Краску наносят на гладкую пластину и переносят на бумагу. Повторить тот же рисунок один в один нельзя.']];
const canvas=document.querySelector('canvas'),frame=document.querySelector('.frame'),detail=document.querySelector('.detail'),dialog=document.querySelector('dialog'),panelTitle=document.querySelector('#panelTitle'),panelBody=document.querySelector('#panelBody');let current=0;
function zoom(on){frame.classList.toggle('zoom',on);detail.setAttribute('aria-pressed',on);detail.lastElementChild.textContent=on?'Весь оттиск':'Фактура'}
function select(n){current=(n+works.length)%works.length;const w=works[current];document.querySelector('#workTitle').textContent=w[0];document.querySelector('#workMeta').textContent=w[1]+' · '+w[2];document.querySelector('#num').textContent=String(current+1).padStart(2,'0');canvas.setAttribute('aria-label',w[3]);zoom(false);drawPrint(canvas,current)}
function panel(type){panelTitle.textContent={index:'Индекс работ',tech:'Техники',about:'О мастерской'}[type];panelBody.className=type==='about'?'about':'list';panelBody.innerHTML=type==='about'?'<p>«Синий оттиск» — мастерская ручной печати. В галерее собраны работы в трёх техниках: линогравюре, шелкографии и монотипии.</p><p>Чтобы рассмотреть след краски и зерно бумаги, откройте «Фактуру» на любом оттиске.</p>':works.map((w,i)=>`<button data-work="${i}" ${i===current?'aria-current="true"':''}><strong>${type==='tech'?w[1]:w[0]}</strong><small>${type==='tech'?w[4]:w[1]+' · '+w[2]}</small><b aria-hidden="true">↗</b></button>`).join('');dialog.showModal()}
document.querySelectorAll('[data-panel]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();panel(el.dataset.panel)}));document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}const item=e.target.closest('[data-work]');if(item){select(+item.dataset.work);dialog.close()}});document.querySelector('#prev').onclick=()=>select(current-1);document.querySelector('#next').onclick=()=>select(current+1);detail.onclick=()=>zoom(!frame.classList.contains('zoom'));document.addEventListener('keydown',e=>{if(!dialog.open&&!e.altKey){if(e.key==='ArrowLeft')select(current-1);if(e.key==='ArrowRight')select(current+1);if(e.key==='Escape'&&frame.classList.contains('zoom'))zoom(false)}});select(0);
</script></body></html>
